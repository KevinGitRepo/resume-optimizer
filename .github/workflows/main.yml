name: "Automated Resume Builder with AI Optimization"

# Defines when the workflow will run
on:
  # Manual trigger using GitHub Actions UI
  workflow_dispatch:
    inputs:
      # Input parameter to choose between apply or destroy actions
      action:
        description: 'Terraform Action to Perform'
        type: choice
        options:
        - Terraform_apply
        - Terraform_destroy
      env_name:
        description: 'Choose environment to run'
        type: choice
        options:
        - env-kevin
        - env-krysten
        - env-susant
        - env-jade
        - env-ater

jobs:
  # Job for applying Terraform configurations
  terraform_apply:
    name: "Terraform_apply"
    # Condition to run this job only when 'Terraform_apply' is selected
    if: ${{ github.event.inputs.action == 'Terraform_apply' }}
    # Specifies the type of runner to use
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env_name }}

    env: 
        TF_VAR_key_name: ${{ secrets.KEY_NAME }}
        TF_VAR_region: ${{ vars.AWS_REGION }}
        TF_VAR_availability_zone_a: "${{ vars.AWS_REGION }}a"
        TF_VAR_availability_zone_b: "${{ vars.AWS_REGION }}b"

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v2

      # Step 2: Set up AWS credentials for authentication
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
      
        with:
          # Using GitHub secrets for secure credential storage
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} # Secret variable
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # Secret variable
          aws-region: ${{ vars.AWS_REGION }}  # Reference the repository variable

      # Step 3: Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2.0.2
        with:
          terraform_version: 1.1.9 # Specifies Terraform version to use
          terraform_wrapper: false

      # Step 4: Initialize Terraform working directory
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=final-project-shared-bucket" \
            -backend-config="key=prod/${{ vars.S3_DIRECTORY }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true"

      # Step 5: Preview the infrastructure changes
      - name: Terraform Plan
        run: terraform plan

      # Step 6: Apply the infrastructure changes
      - name: Terraform Apply
        run: terraform apply -auto-approve # Auto-approve flag skips manual confirmation


  terraform_destroy:
    name: "Terraform_destroy"
    # Condition to run this job only when 'Terraform_destroy' is selected
    if: ${{ github.event.inputs.action == 'Terraform_destroy' }}
    # Specifies the type of runner to use
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env_name }}

    env: 
        TF_VAR_key_name: ${{ secrets.KEY_NAME }}
        TF_VAR_region: ${{ secrets.REGION }}
        TF_VAR_availability_zone_a: "${{ vars.AWS_REGION }}a"
        TF_VAR_availability_zone_b: "${{ vars.AWS_REGION }}b"

    steps:
      # Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up AWS credentials for authentication
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
      
        with:
          # Using GitHub secrets for secure credential storage
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} # Secret variable
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # Secret variable
          aws-region: ${{ vars.AWS_REGION }}  # Reference the repository variable

        # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2.0.2
        with:
          terraform_version: 1.1.9 # Specifies Terraform version to use
          terraform_wrapper: false

        # Initialize Terraform working directory
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=final-project-shared-bucket" \
            -backend-config="key=prod/${{ vars.S3_DIRECTORY }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true"

        # Preview changes??
      - name: Show Destroy plan
        run: terraform plan -destroy

        # Destroy & bypass prompts
      - name: Terraform destroy
        id: destroy
        run: terraform destroy -auto-approve
